name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt flake8
      - name: Check Python syntax
        run: python -m py_compile arcade_stage_fighter.py
      - name: Check for syntax and undefined-name errors
        run: flake8 arcade_stage_fighter.py --count --select=E9,F63,F7,F82 --show-source --statistics
